# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Muhammad Hassan | Mechanical Engineering Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Muhammad Hassan
headline: Mechanical Engineering Student at Drexel University
description: >- # dont remove this line. this will ignore all new lines until the next section
  Mechanical Engineering student at Drexel University with a minor in mathematics, focusing on 
  CAD modeling, mechatronics, and hardware prototyping. Experienced in SolidWorks, MATLAB, 
  Python, and embedded systems development.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: ./assets/images/profile-image/avatar.jpeg


# Link your resume
# You can place your resume in assets/resume/{resume.pdf or add external link such as pdf saved in google drive 
resume-url: /resume.pdf # or /assets/resume/resume.pdf


# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: muhammad-hassan-4ab6162b3   # https://www.linkedin.com/in/{your url slug}     # https://github.com/{your url slug} 
  stackoverflow:       # https://stackoverflow.com/users/{your url slug}
  medium:            # https://medium.com/@{your url slug} 
  x-twitter:   # https://x.com/{your url slug} 
  threads:            # https://threads.net/@{your url slug} 
  instragram:       # https://instagram.com/{your url slug} 
  youtube:           # https://youtube.com/@{your url slug} 
  discord:            # https://discord.com/users/{your url slug} 
  bluesky:           # https://bsky.app/profile/{your url slug} 
  

# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise. 
skills:
  - category: 3D Modeling & CAD
    tools:
    - SolidWorks
    - Assembly & Exploded Views
    - Digital Modeling
    - Technical Drawings & GD&T
  - category: Mechanical
    tools:
    - Structural Analysis
    - Mechanical Assembly
    - Soldering
    - Hand & Power Tools
  - category: Engineering
    tools:
    - High-G Structural Analysis
    - High-Altitude Payload Design
    - Modified Drone Design
    - Hands-on Field Work
  - category: Leadership
    tools:
    - NASA HASP Tungsten Design Team Leader
    - Payload Recovery HASP Team Leader
    - Drexel Rocket Team Engineer
  - category: Fabrication
    tools:
    - 3D Printing (FDM)
    - Rapid Prototyping
    - Mechanical Assembly
    - Root Cause Analysis


# Contact Form Setup. Setup an account and copy over the key. When someone fills out the form, it will be received in your email.
formspree-key:    https://formspree.io/f/{8-digit key}



